apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: skybook-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

spec:
  ingressClassName: alb

  rules:
  - http:
      paths:

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8081

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5173
